[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "efficient-code-agent"
version = "0.1.0"
description = "A lightweight, local-first coding agent harness."
dependencies = []

[project.scripts]
harness = "harness.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".*"]

[tool.ruff]
line-length = 88
src = ["src"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
